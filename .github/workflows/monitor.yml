name: Daily Referral Monitor

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: referral-monitor
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Monitor
        run: npm start
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          CRAWLER_MAX_PAGES: 99999
          FULL_SCENARIOS: 1

      - name: Generate Report
        if: always()
        run: node src/reporter.js

      - name: Prepare Pages Directory
        if: always()
        run: |
          mkdir -p public
          cp report.html public/ || true
          cp status.json public/ || true
          cp -r screenshots public/ || true

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: false

      - name: Commit Subscribers
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add subscribers.json || true
          git commit -m "chore: update telegram subscribers" || true
          git push || true

      - name: Upload Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-reports
          path: |
            report.html
            status.json
            screenshots/
          retention-days: 30
